services:
  - type: web
    name: asmp-django-backend
    env: python
    region: singapore
    buildCommand: "cd backend && pip install -r requirements.txt || pip install poetry && poetry install && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "cd backend && python manage.py runserver 0.0.0.0:10000"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DEBUG
        value: "True"
